<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Inicio de Sesión</title>
    <!-- Tailwind CSS en CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Tarjeta del formulario -->
    <div class="bg-white p-8 rounded-lg tarjeta max-w-md w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Inicio de Sesión</h1>

        <!-- Formulario que envía los datos mediante método POST -->
        <form method="POST" action="/ejercicio2" class="space-y-4">

            <!-- Campo l usuario -->
            <div>
                <label for="usuario" class="block text-gray-700 font-medium mb-1">Ingresa tu nombre</label>
                <input type="text" id="usuario" name="usuario" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-lime-500">
            </div>

            <!-- Campo contraseña -->
            <div>
                <label for="contrasena" class="block text-gray-700 font-medium mb-1">Ingresa tu contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-lime-500">
            </div>

            <!-- Botón -->
            <button type="submit"
                class="w-full bg-lime-600 hover:bg-lime-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200">
                Ingresar
            </button>
        </form>

        <!-- Bloque de mensaje -->
        {% if mensaje %}
        <div
            class="mt-6 p-4 rounded-lg text-center font-medium 
                    {% if es_exito %} bg-green-100 text-green-800 border border-green-200 {% else %} bg-red-100 text-red-800 border border-red-200 {% endif %}">
            {{ mensaje }}
        </div>
        {% endif %}

        <!-- Enlace volver al menú  -->
        <div class="mt-6 text-center">
            <a href="/" class="text-gray-600 hover:text-gray-900 font-medium text-sm">
                ← Volver al Menú Principal
            </a>
        </div>

    </div>

</body>

</html>
